<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>PokeSurvivor Gacha Pro</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .top { display: flex; gap: 12px; flex-wrap: wrap; background: #1e293b; padding: 8px 16px; border-radius: 10px; margin-bottom: 10px; font-size: 13px; border: 1px solid #334155; }
        .wrap { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .box { background: #1e293b; padding: 12px; border-radius: 10px; width: 290px; }
        canvas { background: radial-gradient(circle, #065f46, #022c22); border: 3px solid #10b981; border-radius: 10px; display: block; }
        button { padding: 8px 12px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin: 3px 0; }
        .btn-y { background: #f59e0b; color: black; width: 100%; }
        .btn-g { background: #10b981; color: white; width: 100%; }
        .btn-r { background: #475569; color: white; width: 100%; font-size: 12px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; max-height: 190px; overflow-y: auto; }
        .card { background: #0f172a; padding: 6px; border-radius: 6px; border: 2px solid #475569; cursor: pointer; font-size: 12px; }
        .card.sel { border-color: #10b981; background: #064e3b; }
        .s5 { border-color: #fbbf24; color: #fde68a; } .s4 { border-color: #c084fc; color: #e9d5ff; } .s3 { border-color: #38bdf8; color: #bae6fd; }
        #modal { display: none; position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); background: #1e293b; border: 3px solid #fbbf24; padding: 15px; border-radius: 10px; text-align: center; z-index: 99; }
    </style>
</head>
<body>
    <div class="top">
        <div>⏱️ <strong id="tTxt">00:00</strong></div>
        <div>🏆 Kỷ lục: <strong id="bTxt" style="color:#fbbf24">00:00</strong></div>
        <div>👑 Diệt Boss: <strong id="kTxt">0</strong></div>
        <div>🪙 <strong id="cTxt">300</strong></div>
        <div>❤️ <strong id="hTxt">100</strong></div>
        <div>⭐ Lv.<strong id="lTxt">1</strong> (<span id="eTxt">0/10</span>)</div>
        <div>⚡ Space: <strong id="skTxt">OK</strong></div>
    </div>
    <div class="wrap">
        <div class="box">
            <button class="btn-y" id="bGacha">🎰 Quay Gacha (100 Xu)</button>
            <div id="msg" style="font-size:12px; color:#fbbf24; min-height:18px; margin-top:4px;"></div>
            <div class="grid" id="list"></div>
            <button class="btn-g" id="bStart">⚔️ Bắt Đầu / Chơi Lại</button>
            <button class="btn-r" id="bReset">🗑️ Xóa dữ liệu lưu</button>
        </div>
        <canvas id="cv" width="480" height="420" tabindex="0"></canvas>
    </div>
    <div id="modal">
        <h4>⬆️ LÊN CẤP! CHỌN KỸ NĂNG</h4>
        <button onclick="up('dmg')" style="background:#ef4444;color:white">🔥 +30% Công</button>
        <button onclick="up('spd')" style="background:#38bdf8">⚡ +25% Tốc bắn</button>
        <button onclick="up('orb')" style="background:#f97316;color:white">☄️ +1 Cầu lửa</button>
        <button onclick="up('hp')" style="background:#10b981;color:white">💚 Hồi 40 Máu</button>
    </div>
    <script>
        const pool = [
            { id: "p1", name: "Chuột Sấm", icon: "🐭", star: 4, col: "#facc15", dmg: 20, rate: 450 },
            { id: "p2", name: "Rồng Lửa", icon: "🐉", star: 4, col: "#f97316", dmg: 28, rate: 550 },
            { id: "p3", name: "Rùa Nước", icon: "🐢", star: 3, col: "#38bdf8", dmg: 15, rate: 400 },
            { id: "p4", name: "Ếch Cỏ", icon: "🐸", star: 3, col: "#4ade80", dmg: 14, rate: 380 },
            { id: "p5", name: "Mèo Thần", icon: "🐱", star: 5, col: "#e879f9", dmg: 45, rate: 300 }
        ];
        let coins = 300, inv = [ Object.assign({}, pool[0], { cnt: 1 }) ], sel = inv[0], bestSec = 0, bossKills = 0;

        function fmt(s) { return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
        function save() { try { localStorage.setItem("pkPro", JSON.stringify({ coins, inv, sid: sel.id, bestSec, bossKills })); } catch(e){} }
        function load() {
            try {
                let d = JSON.parse(localStorage.getItem("pkPro"));
                if (d && d.inv && d.inv.length) {
                    coins = d.coins; inv = d.inv; bestSec = d.bestSec || 0; bossKills = d.bossKills || 0;
                    sel = inv.find(x => x.id === d.sid) || inv[0];
                }
            } catch(e){}
        }
        function drawInv() {
            let el = document.getElementById("list"); el.innerHTML = "";
            inv.forEach(p => {
                let d = document.createElement("div");
                d.className = `card s${p.star} ${sel.id === p.id ? 'sel' : ''}`;
                d.innerHTML = `${p.icon} <b>${p.name}</b><br>${"★".repeat(p.star)} +${p.cnt-1}<br>ST: ${p.dmg+(p.cnt-1)*5}`;
                d.onclick = () => { sel = p; save(); drawInv(); };
                el.appendChild(d);
            });
            document.getElementById("cTxt").innerText = coins;
            document.getElementById("bTxt").innerText = fmt(bestSec);
            document.getElementById("kTxt").innerText = bossKills;
        }
        document.getElementById("bGacha").onclick = () => {
            if (coins < 100) return document.getElementById("msg").innerText = "❌ Thiếu Xu!";
            coins -= 100;
            let r = Math.random() * 100, f = pool.filter(p => p.star === (r < 10 ? 5 : r < 45 ? 4 : 3));
            let got = f[Math.floor(Math.random() * f.length)], ex = inv.find(p => p.id === got.id);
            if (ex) { ex.cnt++; document.getElementById("msg").innerText = `🎉 Trùng ${got.icon} ${got.name} (+${ex.cnt-1})`; }
            else { inv.push(Object.assign({}, got, { cnt: 1 })); document.getElementById("msg").innerText = `🎉 Nhận ${got.icon} ${got.name} (${got.star}★)`; }
            save(); drawInv();
        };
        document.getElementById("bReset").onclick = () => { localStorage.removeItem("pkPro"); location.reload(); };

        const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
        let run = false, pause = false, keys = {}, bullets = [], eBullets = [], ens = [], gems = [], boss = null;
        let p = { x: 240, y: 210, r: 16, hp: 100, mhp: 100, spd: 3.5, lv: 1, exp: 0, nexp: 10, dmg: 20, rate: 450, col: "#10b981", icon: "🐭" };
        let lShot = 0, lSpw = 0, sec = 0, lSec = 0, nBoss = 30, orb = 0, orbA = 0, novaOk = true, lNova = 0, lBossShot = 0;

        window.onkeydown = e => {
            keys[e.code] = true;
            if (e.code === "Space" && run && !pause && novaOk) {
                e.preventDefault(); novaOk = false; lNova = performance.now(); eBullets = [];
                ens.forEach(en => { if (Math.hypot(p.x - en.x, p.y - en.y) < 160) { en.hp -= p.dmg * 2.5; let a = Math.atan2(en.y - p.y, en.x - p.x); en.x += Math.cos(a)*45; en.y += Math.sin(a)*45; } });
                if (boss && Math.hypot(p.x - boss.x, p.y - boss.y) < 160 + boss.r) boss.hp -= p.dmg * 2.5;
            }
        };
        window.onkeyup = e => keys[e.code] = false;
        document.getElementById("bStart").onclick = () => {
            p = { x: 240, y: 210, r: 16, hp: 100, mhp: 100, spd: 3.5, lv: 1, exp: 0, nexp: 10, dmg: sel.dmg + (sel.cnt-1)*5, rate: sel.rate, col: sel.col, icon: sel.icon };
            bullets = []; eBullets = []; ens = []; gems = []; boss = null; sec = 0; nBoss = 30; orb = 0; novaOk = true;
            run = true; pause = false; document.getElementById("modal").style.display = "none"; cv.focus(); ui();
        };
        function up(t) {
            if (t === 'dmg') p.dmg = Math.round(p.dmg * 1.3);
            if (t === 'spd') p.rate = Math.max(100, Math.round(p.rate * 0.75));
            if (t === 'orb') orb++;
            if (t === 'hp') p.hp = Math.min(p.mhp, p.hp + 40);
            pause = false; document.getElementById("modal").style.display = "none"; ui();
        }
        function ui() {
            document.getElementById("tTxt").innerText = fmt(sec);
            document.getElementById("bTxt").innerText = fmt(bestSec);
            document.getElementById("kTxt").innerText = bossKills;
            document.getElementById("hTxt").innerText = Math.max(0, Math.floor(p.hp));
            document.getElementById("lTxt").innerText = p.lv;
            document.getElementById("eTxt").innerText = `${p.exp}/${p.nexp}`;
            document.getElementById("cTxt").innerText = coins;
        }
        function drawEmoji(ico, x, y, size) {
            ctx.font = `${size}px Arial`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(ico, x, y);
        }
        function loop(ts) {
            ctx.clearRect(0, 0, cv.width, cv.height);
            if (run && !pause) {
                if (ts - lSec >= 1000) {
                    lSec = ts; sec++;
                    if (sec > bestSec) { bestSec = sec; save(); }
                    ui();
                    if (sec >= nBoss && !boss) { let mh = 450 + sec * 18; boss = { x: 240, y: -30, r: 28, hp: mh, mhp: mh, spd: 1.0, icon: "👹" }; nBoss += 30; }
                }
                if ((keys["KeyW"] || keys["ArrowUp"]) && p.y > p.r) p.y -= p.spd;
                if ((keys["KeyS"] || keys["ArrowDown"]) && p.y < cv.height - p.r) p.y += p.spd;
                if ((keys["KeyA"] || keys["ArrowLeft"]) && p.x > p.r) p.x -= p.spd;
                if ((keys["KeyD"] || keys["ArrowRight"]) && p.x < cv.width - p.r) p.x += p.spd;

                if (ts - lSpw > 800) {
                    lSpw = ts; let s = Math.floor(Math.random()*4), tp = Math.random();
                    let ex = s===0?0:s===1?cv.width:Math.random()*cv.width, ey = s===2?0:s===3?cv.height:Math.random()*cv.height;
                    if (tp < 0.25) ens.push({ x: ex, y: ey, r: 11, hp: 12 + sec*0.5, spd: 2.3, icon: "🦇" }); // Quái nhanh
                    else if (tp < 0.45) ens.push({ x: ex, y: ey, r: 16, hp: 45 + sec*2, spd: 0.9, icon: "🗿" }); // Quái giáp trâu
                    else ens.push({ x: ex, y: ey, r: 13, hp: 20 + sec, spd: 1.4, icon: "👾" }); // Quái thường
                }
                let tg = boss ? [...ens, boss] : ens;
                if (ts - lShot > p.rate && tg.length) {
                    lShot = ts;
                    let nr = tg.reduce((a, b) => Math.hypot(b.x-p.x, b.y-p.y) < Math.hypot(a.x-p.x, a.y-p.y) ? b : a);
                    let ang = Math.atan2(nr.y - p.y, nr.x - p.x);
                    bullets.push({ x: p.x, y: p.y, vx: Math.cos(ang)*6.5, vy: Math.sin(ang)*6.5 });
                }
                for (let i = bullets.length - 1; i >= 0; i--) {
                    bullets[i].x += bullets[i].vx; bullets[i].y += bullets[i].vy;
                    if (bullets[i].x < 0 || bullets[i].x > cv.width || bullets[i].y < 0 || bullets[i].y > cv.height) bullets.splice(i, 1);
                }
                for (let i = eBullets.length - 1; i >= 0; i--) {
                    eBullets[i].x += eBullets[i].vx; eBullets[i].y += eBullets[i].vy;
                    if (Math.hypot(p.x - eBullets[i].x, p.y - eBullets[i].y) < p.r + 5) { p.hp -= 12; eBullets.splice(i, 1); ui(); continue; }
                    if (eBullets[i].x < 0 || eBullets[i].x > cv.width || eBullets[i].y < 0 || eBullets[i].y > cv.height) eBullets.splice(i, 1);
                }
                for (let i = ens.length - 1; i >= 0; i--) {
                    let e = ens[i], ang = Math.atan2(p.y - e.y, p.x - e.x);
                    e.x += Math.cos(ang)*e.spd; e.y += Math.sin(ang)*e.spd;
                    if (Math.hypot(p.x - e.x, p.y - e.y) < p.r + e.r) { p.hp -= 0.4; ui(); }
                    for (let j = bullets.length - 1; j >= 0; j--) if (Math.hypot(bullets[j].x - e.x, bullets[j].y - e.y) < e.r + 5) { e.hp -= p.dmg; bullets.splice(j, 1); break; }
                    if (e.hp <= 0) { gems.push({ x: e.x, y: e.y, v: 2 }); ens.splice(i, 1); coins += 5; save(); ui(); }
                }
                if (boss) {
                    let ang = Math.atan2(p.y - boss.y, p.x - boss.x); boss.x += Math.cos(ang)*boss.spd; boss.y += Math.sin(ang)*boss.spd;
                    if (ts - lBossShot > 2200) {
                        lBossShot = ts;
                        for (let k = 0; k < 8; k++) { let a = k * (Math.PI / 4); eBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a)*3.2, vy: Math.sin(a)*3.2 }); }
                    }
                    if (Math.hypot(p.x - boss.x, p.y - boss.y) < p.r + boss.r) { p.hp -= 0.8; ui(); }
                    for (let j = bullets.length - 1; j >= 0; j--) if (Math.hypot(bullets[j].x - boss.x, bullets[j].y - boss.y) < boss.r + 5) { boss.hp -= p.dmg; bullets.splice(j, 1); }
                    if (boss.hp <= 0) { gems.push({ x: boss.x, y: boss.y, v: 15 }); coins += 100; bossKills++; save(); boss = null; ui(); }
                }
                if (!novaOk && ts - lNova >= 5000) novaOk = true;
                document.getElementById("skTxt").innerText = novaOk ? "OK" : "Chờ...";
                for (let i = gems.length - 1; i >= 0; i--) {
                    if (Math.hypot(p.x - gems[i].x, p.y - gems[i].y) < p.r + 14) {
                        p.exp += gems[i].v; gems.splice(i, 1);
                        if (p.exp >= p.nexp) { p.exp = 0; p.lv++; p.nexp = Math.round(p.nexp * 1.4); pause = true; document.getElementById("modal").style.display = "block"; }
                        ui();
                    }
                }
                if (p.hp <= 0) { run = false; save(); document.getElementById("msg").innerText = `💀 Đạt ${fmt(sec)}! Bấm Bắt Đầu chơi lại.`; }
            }
            gems.forEach(g => { drawEmoji(g.v > 5 ? "🌟" : "💎", g.x, g.y, g.v > 5 ? 18 : 13); });
            ens.forEach(e => { drawEmoji(e.icon, e.x, e.y, e.r * 2); });
            if (boss) {
                drawEmoji(boss.icon, boss.x, boss.y, boss.r * 2);
                ctx.fillStyle = "#ef4444"; ctx.fillRect(boss.x - 30, boss.y - boss.r - 10, 60 * Math.max(0, boss.hp/boss.mhp), 6);
            }
            ctx.fillStyle = p.col; bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, 6.28); ctx.fill(); });
            ctx.fillStyle = "#f43f5e"; eBullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, 6.28); ctx.fill(); });
            if (run && orb > 0) {
                orbA += 0.06;
                for (let i = 0; i < orb; i++) {
                    let a = orbA + i * 6.28 / orb, ox = p.x + Math.cos(a)*50, oy = p.y + Math.sin(a)*50;
                    drawEmoji("🔥", ox, oy, 16);
                    ens.forEach(e => { if (Math.hypot(ox - e.x, oy - e.y) < e.r + 8) e.hp -= p.dmg * 0.15; });
                    if (boss && Math.hypot(ox - boss.x, oy - boss.y) < boss.r + 8) boss.hp -= p.dmg * 0.15;
                }
            }
            drawEmoji(p.icon, p.x, p.y, p.r * 2);
            requestAnimationFrame(loop);
        }
        load(); drawInv(); requestAnimationFrame(loop);
    </script>
</body>
</html>
